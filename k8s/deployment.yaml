apiVersion: apps/v1
kind: Deployment
metadata:
  name: punitxd-express-hello-world
  namespace: kairo-punitxd-express-hello-world
  labels:
    app: punitxd-express-hello-world
    app.kubernetes.io/managed-by: kairo
spec:
  replicas: 1
  # rollback needs old ReplicaSets to still be around
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: punitxd-express-hello-world
  template:
    metadata:
      labels:
        app: punitxd-express-hello-world
        app.kubernetes.io/managed-by: kairo
    spec:
      containers:
        - name: punitxd-express-hello-world
          image: kairo/punitxd-express-hello-world:039c34770852fb07cef7f9f0f8534c5de408b207
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # liveness + memory limit are what make self-healing possible.
          # don't remove them without talking to BE 2
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
